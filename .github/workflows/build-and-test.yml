name: build and test

on:
  push:
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '8.0.417'

jobs:
  build-and-test:
    name: build-and-test-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install NuGet packages
        run: dotnet restore
      
      - name: Build
        run: dotnet build .\src\SetlistPlaylistCreator.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test .\src\SetlistPlaylistCreator.sln --configuration Release --no-build --verbosity normal
